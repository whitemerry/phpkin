name: Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - '5.3'
          - '5.6'
          - '7.0'
          - '7.4'
          - '8.0'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:${{ matrix.php == '5.3' && '2.2' || 'v2' }}
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-php${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-php${{ matrix.php }}-

      # composer.lock is not committed, and each PHP version resolves its own
      # PHPUnit major, so update rather than install.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  # Zipkin timestamps are 16 digits, which overflows a 32-bit int. php.net
  # shipped x86 as the default Windows build for years, so that is where users
  # hit it (see issue #18). linux/386 runs natively on the amd64 runners, so
  # this needs no emulation.
  tests-32bit:
    name: PHP 8.3 (32-bit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # vendor/ holds only PHP sources, so building it on the amd64 host and
      # executing it with the 32-bit interpreter is safe. It also keeps
      # Composer out of the container, which ships without unzip.
      - name: Run tests on 32-bit PHP
        run: |
          docker run --rm --platform linux/386 \
            --volume "$PWD:/app" --workdir /app \
            php:8.3-cli sh -c '
              set -e
              php -r "if (PHP_INT_SIZE !== 4) {
                  fwrite(STDERR, \"expected a 32-bit build, got PHP_INT_SIZE=\" . PHP_INT_SIZE . \"\n\");
                  exit(1);
              }"
              vendor/bin/phpunit
            '
